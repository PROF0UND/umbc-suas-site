site:
  name: UMBC SUAS
  site: 'https://example.com' # TODO: set to the real deployed domain (Cloudflare Pages URL or custom domain)
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: '' # TODO: add if/when Google Search Console verification is set up

# Default SEO metadata
metadata:
  title:
    default: UMBC SUAS
    template: '%s — UMBC SUAS'
  description: "UMBC's Small Unmanned Aircraft Systems (SUAS) competition team — vehicles, build log, sponsors, and team info."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: UMBC SUAS
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '' # TODO: add the team's real handle, if any
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'log' # Build log main path (/log)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
